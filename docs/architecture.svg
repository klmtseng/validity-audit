<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="840" viewBox="0 0 1400 840"
  role="img" aria-labelledby="title desc">
  <title id="title">Validity Audit five-layer architecture and adoption modes</title>
  <desc id="desc">A bounded task contract and artifact set pass through evidence capture,
    independent review, reproduction policy, and an unsigned audit record. Three adoption modes
    show repository CLI available, plugin integration partial, and embedded API integration future.
  </desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#d8d4ca" stroke-width="1"
        opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5"
      orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d89a3d"/>
    </marker>
    <style>
      .ink { fill: #17324d; }
      .muted { fill: #5f6d78; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 1.5px; }
      .layer-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mode-title { font: 700 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1400" height="840" rx="22" fill="#f7f4ec"/>
  <rect x="22" y="22" width="1356" height="796" rx="18" fill="url(#grid)"
    stroke="#c8c3b8" stroke-width="2"/>

  <text x="70" y="78" class="ink"
    style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 34px; font-weight: 700; letter-spacing: 1px;">
    VALIDITY AUDIT
  </text>
  <text x="70" y="112" class="muted body">
    Five assurance layers for one task run and one digest-bound artifact set
  </text>
  <line x1="70" y1="132" x2="1330" y2="132" stroke="#d89a3d" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="70" y="192" width="245" height="214" rx="16" fill="#fffdf8"
      stroke="#17324d" stroke-width="2"/>
  </g>
  <text x="94" y="228" class="label" fill="#b57824">BOUNDED INPUT</text>
  <text x="94" y="270" class="layer-title ink">Task contract</text>
  <text x="94" y="302" class="body muted">Claims</text>
  <text x="94" y="331" class="body muted">Artifact paths</text>
  <text x="94" y="360" class="body muted">Domain packs</text>
  <text x="94" y="389" class="body muted">Policy overrides</text>

  <line x1="315" y1="299" x2="376" y2="299" stroke="#d89a3d" stroke-width="4"
    marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="390" y="165" width="625" height="322" rx="18" fill="#fffdf8"
      stroke="#17324d" stroke-width="2"/>
  </g>
  <text x="418" y="201" class="label" fill="#b57824">ASSURANCE PIPELINE</text>

  <g>
    <rect x="418" y="224" width="569" height="46" rx="9" fill="#e9eef2"/>
    <circle cx="444" cy="247" r="14" fill="#17324d"/>
    <text x="439" y="253" fill="#fffdf8" class="small">1</text>
    <text x="470" y="254" class="layer-title ink">Contract boundary</text>

    <rect x="418" y="278" width="569" height="46" rx="9" fill="#eef1ed"/>
    <circle cx="444" cy="301" r="14" fill="#17324d"/>
    <text x="439" y="307" fill="#fffdf8" class="small">2</text>
    <text x="470" y="308" class="layer-title ink">Evidence capture and probes</text>

    <rect x="418" y="332" width="569" height="46" rx="9" fill="#f4ecdf"/>
    <circle cx="444" cy="355" r="14" fill="#d89a3d"/>
    <text x="439" y="361" fill="#fffdf8" class="small">3</text>
    <text x="470" y="362" class="layer-title ink">Independent cold / primed review</text>

    <rect x="418" y="386" width="569" height="46" rx="9" fill="#eef1ed"/>
    <circle cx="444" cy="409" r="14" fill="#17324d"/>
    <text x="439" y="415" fill="#fffdf8" class="small">4</text>
    <text x="470" y="416" class="layer-title ink">Reproduction and error-class policy</text>

    <rect x="418" y="440" width="569" height="46" rx="9" fill="#e9eef2"/>
    <circle cx="444" cy="463" r="14" fill="#17324d"/>
    <text x="439" y="469" fill="#fffdf8" class="small">5</text>
    <text x="470" y="470" class="layer-title ink">Unsigned attestation and receipt</text>
  </g>

  <line x1="1015" y1="299" x2="1076" y2="299" stroke="#d89a3d" stroke-width="4"
    marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1090" y="192" width="240" height="214" rx="16" fill="#fffdf8"
      stroke="#17324d" stroke-width="2"/>
  </g>
  <text x="1114" y="228" class="label" fill="#b57824">BOUNDED OUTPUT</text>
  <text x="1114" y="270" class="layer-title ink">Audit record</text>
  <text x="1114" y="302" class="body muted">Result + findings</text>
  <text x="1114" y="331" class="body muted">Evidence digests</text>
  <text x="1114" y="360" class="body muted">Policy id</text>
  <text x="1114" y="389" class="body muted">Signature: null</text>

  <text x="70" y="554" class="label" fill="#b57824">ADOPTION MODES</text>

  <g filter="url(#shadow)">
    <rect x="70" y="578" width="390" height="170" rx="16" fill="#fffdf8"
      stroke="#2f6f57" stroke-width="3"/>
    <rect x="505" y="578" width="390" height="170" rx="16" fill="#fffdf8"
      stroke="#d89a3d" stroke-width="3"/>
    <rect x="940" y="578" width="390" height="170" rx="16" fill="#fffdf8"
      stroke="#8a949c" stroke-width="3" stroke-dasharray="9 7"/>
  </g>

  <text x="94" y="615" class="label" fill="#2f6f57">AVAILABLE</text>
  <text x="94" y="653" class="mode-title ink">Repository / CLI</text>
  <text x="94" y="684" class="small muted">prepare → review → finalize</text>
  <text x="94" y="712" class="small muted">Public regression case in CI</text>

  <text x="529" y="615" class="label" fill="#b57824">PARTIAL · DOWNSTREAM</text>
  <text x="529" y="653" class="mode-title ink">Plugin / agent skill</text>
  <text x="529" y="684" class="small muted">Protocol integration exists</text>
  <text x="529" y="712" class="small muted">Distribution lives elsewhere</text>

  <text x="964" y="615" class="label" fill="#6f7a83">FUTURE</text>
  <text x="964" y="653" class="mode-title ink">Embedded API / model</text>
  <text x="964" y="684" class="small muted">Provider adapters + user key</text>
  <text x="964" y="712" class="small muted">Signing and identity semantics</text>

  <text x="70" y="790" class="small muted">
    Assurance unit: one run · one contract · one artifact set · explicitly unsigned in v0.3
  </text>
</svg>
