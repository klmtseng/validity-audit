<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Validity Audit architecture with verifier challenge loop</title>
  <desc id="desc">A bounded task and artifact set move through evidence capture, independent review, reproduction and policy, and a digest-bound unsigned attestation. A separate verifier challenge loop applies positive, negative, and fault controls plus skip accounting to the probes, scorer, and evidence import path, so the checking mechanisms are tested as well as the agent output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c8842f"/>
    </marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#326b58"/>
    </marker>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .subtitle { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6d78; }
      .eyebrow { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.4px; }
      .node-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17324d; }
      .body { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6d78; }
      .small { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5f6d78; }
      .loop-title { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #244f43; }
    </style>
  </defs>

  <rect width="1400" height="900" rx="22" fill="#f7f4ec"/>
  <rect x="22" y="22" width="1356" height="856" rx="18" fill="#fbfaf6" stroke="#c8c3b8" stroke-width="2"/>

  <text x="70" y="76" class="title">VALIDITY AUDIT</text>
  <text x="70" y="108" class="subtitle">Audit the output. Challenge the verifier. Bind the result to the exact evidence.</text>
  <line x1="70" y1="130" x2="1330" y2="130" stroke="#c8842f" stroke-width="4"/>

  <!-- Main audit flow -->
  <text x="70" y="172" class="eyebrow" fill="#a96d25">ONE BOUNDED AUDIT RUN</text>

  <rect x="70" y="200" width="225" height="190" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <text x="92" y="232" class="eyebrow" fill="#a96d25">1 · CONTRACT</text>
  <text x="92" y="270" class="node-title">Task boundary</text>
  <text x="92" y="302" class="body">Claims + artifacts</text>
  <text x="92" y="330" class="body">Domain packs</text>
  <text x="92" y="358" class="body">Policy overrides</text>

  <line x1="295" y1="295" x2="330" y2="295" stroke="#c8842f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="345" y="200" width="225" height="190" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <text x="367" y="232" class="eyebrow" fill="#a96d25">2 · EVIDENCE</text>
  <text x="367" y="270" class="node-title">Capture bytes</text>
  <text x="367" y="302" class="body">Digest artifacts</text>
  <text x="367" y="330" class="body">Run probes</text>
  <text x="367" y="358" class="body">Build review bundle</text>

  <line x1="570" y1="295" x2="605" y2="295" stroke="#c8842f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="620" y="200" width="225" height="190" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <text x="642" y="232" class="eyebrow" fill="#a96d25">3 · REVIEW</text>
  <text x="642" y="270" class="node-title">Independent review</text>
  <text x="642" y="302" class="body">Cold or primed</text>
  <text x="642" y="330" class="body">Raw transcript</text>
  <text x="642" y="358" class="body">Structured findings</text>

  <line x1="845" y1="295" x2="880" y2="295" stroke="#c8842f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="895" y="200" width="225" height="190" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <text x="917" y="232" class="eyebrow" fill="#a96d25">4 · GATE</text>
  <text x="917" y="270" class="node-title">Reproduce + policy</text>
  <text x="917" y="302" class="body">Import evidence</text>
  <text x="917" y="330" class="body">Classify failures</text>
  <text x="917" y="358" class="body">Score regression</text>

  <line x1="1120" y1="295" x2="1155" y2="295" stroke="#c8842f" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1170" y="200" width="160" height="190" rx="15" fill="#ffffff" stroke="#17324d" stroke-width="2"/>
  <text x="1192" y="232" class="eyebrow" fill="#a96d25">5 · RECORD</text>
  <text x="1192" y="270" class="node-title">Attestation</text>
  <text x="1192" y="302" class="body">Result</text>
  <text x="1192" y="330" class="body">Findings</text>
  <text x="1192" y="358" class="body">Digests</text>

  <!-- Verifier challenge loop -->
  <rect x="70" y="455" width="1260" height="300" rx="20" fill="#eef4f0" stroke="#326b58" stroke-width="3"/>
  <text x="96" y="493" class="eyebrow" fill="#326b58">V0.4 · AUDIT THE AUDITOR</text>
  <text x="96" y="530" class="loop-title">Challenge the mechanisms that produce the green check</text>
  <text x="96" y="558" class="body">A passing verifier counts as evidence only after its failure semantics have been exercised.</text>

  <rect x="96" y="592" width="245" height="112" rx="13" fill="#ffffff" stroke="#326b58" stroke-width="2"/>
  <text x="116" y="622" class="node-title">Known controls</text>
  <text x="116" y="651" class="body">Positive → must pass</text>
  <text x="116" y="678" class="body">Negative / fault → must fail</text>

  <line x1="341" y1="648" x2="390" y2="648" stroke="#326b58" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="405" y="592" width="245" height="112" rx="13" fill="#ffffff" stroke="#326b58" stroke-width="2"/>
  <text x="425" y="622" class="node-title">Coverage accounting</text>
  <text x="425" y="651" class="body">In-scope vs checked</text>
  <text x="425" y="678" class="body">Skipped + why</text>

  <line x1="650" y1="648" x2="699" y2="648" stroke="#326b58" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="714" y="592" width="245" height="112" rx="13" fill="#ffffff" stroke="#326b58" stroke-width="2"/>
  <text x="734" y="622" class="node-title">Standing challenges</text>
  <text x="734" y="651" class="body">Probes + scorer</text>
  <text x="734" y="678" class="body">Importer / linkage next</text>

  <line x1="959" y1="648" x2="1008" y2="648" stroke="#326b58" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="1023" y="592" width="281" height="112" rx="13" fill="#ffffff" stroke="#326b58" stroke-width="2"/>
  <text x="1043" y="622" class="node-title">Regression memory</text>
  <text x="1043" y="651" class="body">Miss ledger + golden key</text>
  <text x="1043" y="678" class="body">New misses become future tests</text>

  <!-- Feedback arrows back to production verifiers -->
  <path d="M 1160 592 C 1160 525, 1030 525, 1008 405" fill="none" stroke="#326b58" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#loop-arrow)"/>
  <path d="M 790 592 C 790 510, 520 520, 470 405" fill="none" stroke="#326b58" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#loop-arrow)"/>
  <text x="840" y="438" class="small" fill="#326b58">challenge production verifiers</text>

  <text x="70" y="808" class="eyebrow" fill="#a96d25">ASSURANCE BOUNDARY</text>
  <text x="70" y="840" class="body">One task · one artifact set · one evidence chain · unsigned record. Verifier challenges test checker behavior, not global correctness.</text>
</svg>
