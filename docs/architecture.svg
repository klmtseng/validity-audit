<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Validity Audit architecture with verifier challenge loop</title>
  <desc id="desc">A bounded task and artifact set move through evidence capture, independent review, reproduction and policy, and a digest-bound unsigned attestation. A separate verifier challenge loop applies positive, negative, and fault controls plus skip accounting to probes, the scorer, and review import and claim linkage, so the checking mechanisms are tested as well as the agent output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#c86f00"/></marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#17614b"/></marker>
    <style>
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0b2342; }
      .subtitle { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #566171; }
      .eyebrow { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.1px; }
      .node-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0b2342; }
      .body { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #223047; }
      .small { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #566171; }
      .loop-title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #145844; }
      .loop-node-title { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #145844; }
    </style>
  </defs>

  <rect width="1536" height="1024" rx="24" fill="#f7f4ec"/>
  <rect x="2" y="2" width="1532" height="1020" rx="22" fill="#fbfaf6" stroke="#c8c3b8" stroke-width="2"/>

  <text x="52" y="70" class="title">VALIDITY AUDIT</text>
  <text x="52" y="108" class="subtitle">Audit the output. Challenge the verifier. Bind the result to the exact evidence.</text>
  <line x1="52" y1="132" x2="1484" y2="132" stroke="#c86f00" stroke-width="4"/>

  <text x="52" y="184" class="eyebrow" fill="#c65f00">ONE BOUNDED AUDIT RUN</text>

  <rect x="48" y="224" width="260" height="244" rx="20" fill="#ffffff" stroke="#0b2342" stroke-width="2"/>
  <text x="76" y="264" class="eyebrow" fill="#c65f00">1 · CONTRACT</text>
  <text x="76" y="309" class="node-title">Task boundary</text>
  <text x="76" y="353" class="body">Claims + artifacts</text>
  <text x="76" y="390" class="body">Domain packs</text>
  <text x="76" y="427" class="body">Policy overrides</text>

  <line x1="308" y1="346" x2="350" y2="346" stroke="#c86f00" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="364" y="224" width="260" height="244" rx="20" fill="#ffffff" stroke="#0b2342" stroke-width="2"/>
  <text x="392" y="264" class="eyebrow" fill="#c65f00">2 · EVIDENCE</text>
  <text x="392" y="309" class="node-title">Capture bytes</text>
  <text x="392" y="353" class="body">Digest artifacts</text>
  <text x="392" y="390" class="body">Run probes</text>
  <text x="392" y="427" class="body">Build review bundle</text>

  <line x1="624" y1="346" x2="666" y2="346" stroke="#c86f00" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="224" width="264" height="244" rx="20" fill="#ffffff" stroke="#0b2342" stroke-width="2"/>
  <text x="708" y="264" class="eyebrow" fill="#c65f00">3 · REVIEW</text>
  <text x="708" y="309" class="node-title">Independent review</text>
  <text x="708" y="353" class="body">Cold or primed</text>
  <text x="708" y="390" class="body">Raw transcript</text>
  <text x="708" y="427" class="body">Structured findings</text>

  <line x1="944" y1="346" x2="986" y2="346" stroke="#c86f00" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1000" y="224" width="252" height="244" rx="20" fill="#ffffff" stroke="#0b2342" stroke-width="2"/>
  <text x="1028" y="264" class="eyebrow" fill="#c65f00">4 · GATE</text>
  <text x="1028" y="309" class="node-title">Reproduce + policy</text>
  <text x="1028" y="353" class="body">Import evidence</text>
  <text x="1028" y="390" class="body">Classify failures</text>
  <text x="1028" y="427" class="body">Score regression</text>

  <line x1="1252" y1="346" x2="1290" y2="346" stroke="#c86f00" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="1304" y="224" width="184" height="244" rx="20" fill="#ffffff" stroke="#0b2342" stroke-width="2"/>
  <text x="1330" y="264" class="eyebrow" fill="#c65f00">5 · RECORD</text>
  <text x="1330" y="309" class="node-title">Attestation</text>
  <text x="1330" y="353" class="body">Result</text>
  <text x="1330" y="390" class="body">Findings</text>
  <text x="1330" y="427" class="body">Digests</text>

  <text x="812" y="518" class="small">challenge production verifiers</text>

  <rect x="48" y="542" width="1440" height="360" rx="22" fill="#eef4f0" stroke="#17614b" stroke-width="3"/>
  <text x="76" y="586" class="eyebrow" fill="#17614b">V0.4 · AUDIT THE AUDITOR</text>
  <text x="76" y="630" class="loop-title">Challenge the mechanisms that produce the green check</text>
  <text x="76" y="668" class="subtitle">A passing verifier counts as evidence only after its failure semantics have been exercised.</text>

  <rect x="74" y="698" width="316" height="176" rx="18" fill="#ffffff" stroke="#17614b" stroke-width="2"/>
  <text x="100" y="742" class="loop-node-title">Known controls</text>
  <text x="100" y="787" class="body">Positive → must pass</text>
  <text x="100" y="829" class="body">Negative / fault → must fail</text>

  <line x1="390" y1="786" x2="432" y2="786" stroke="#17614b" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="446" y="698" width="294" height="176" rx="18" fill="#ffffff" stroke="#17614b" stroke-width="2"/>
  <text x="472" y="742" class="loop-node-title">Coverage accounting</text>
  <text x="472" y="787" class="body">In-scope vs checked</text>
  <text x="472" y="829" class="body">Skipped + why</text>

  <line x1="740" y1="786" x2="782" y2="786" stroke="#17614b" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="796" y="698" width="292" height="176" rx="18" fill="#ffffff" stroke="#17614b" stroke-width="2"/>
  <text x="822" y="742" class="loop-node-title">Standing challenges</text>
  <text x="822" y="787" class="body">Probes + scorer</text>
  <text x="822" y="829" class="body">Review import + linkage</text>

  <line x1="1088" y1="786" x2="1130" y2="786" stroke="#17614b" stroke-width="4" marker-end="url(#loop-arrow)"/>

  <rect x="1144" y="698" width="318" height="176" rx="18" fill="#ffffff" stroke="#17614b" stroke-width="2"/>
  <text x="1170" y="742" class="loop-node-title">Regression memory</text>
  <text x="1170" y="787" class="body">Miss ledger + golden key</text>
  <text x="1170" y="829" class="body">New misses become</text>
  <text x="1170" y="858" class="body">future tests</text>

  <path d="M1304 698 C1295 612, 1145 612, 1126 478" fill="none" stroke="#17614b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#loop-arrow)"/>
  <path d="M842 698 C818 606, 566 611, 494 478" fill="none" stroke="#17614b" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#loop-arrow)"/>

  <text x="52" y="952" class="eyebrow" fill="#c65f00">ASSURANCE BOUNDARY</text>
  <text x="52" y="990" class="subtitle">One task · one artifact set · one evidence chain · unsigned record. Verifier challenges test checker behavior, not global correctness.</text>
</svg>
